name = "QICLean"
version = "0.1.0"
keywords = ["math", "quantum-information", "quantum-channels", "formal-verification"]
description = "Finite-dimensional quantum-channel theory, quantum Wielandt theory, and spectral/QPF theory, formalized in Lean 4, following Wolf's Quantum Channels & Operations."
homepage = "https://lionsr.github.io/QICLean/"
# The default target builds the whole QICLean library.
defaultTargets = ["QICLean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "Gametheory"
git = "https://github.com/LionSR/Brouwer.git"
rev = "ec93e4daed4ad8b4784a9d760e492832e7711433"

# Pinned to the exact commit TNLean's lake-manifest.json resolves today
# (de295511d), not the "v4.34.0-rc1" tag alone, so a fresh QICLean clone and
# a fresh TNLean clone build against byte-identical Mathlib sources before
# either side has run an update. See docs/UPGRADE_RUNBOOK.md for how this
# pin moves in lockstep with TNLean's.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11"

[[lean_lib]]
name = "QICLean"

# Text-based style linter driver for `Mathlib.Linter.TextBased.lintModules`.
# Run with `lake exe lint_style` (or `--fix` to auto-correct, `--github` for CI annotations).
[[lean_exe]]
name = "lint_style"
srcDir = "scripts"
root = "LintStyle"
supportInterpreter = true
