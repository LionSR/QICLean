  <text x="42" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#eef1f7">ManyBody</text>
  <rect x="334" y="53" width="102" height="18" rx="9" fill="#17233a" stroke="#2f4a7c" stroke-width="1"/>
  <text x="385.0" y="65.4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.4" font-weight="600" fill="#6895f5">Parts 5, 6 &amp; 8</text>
