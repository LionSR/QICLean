<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img" aria-label="QICLean layered architecture: built on Mathlib 4, progressing from Algebra, Analysis, Spectral, Probability, and Representation through Channel, Kraus, and Entropy to ManyBody and Circuit, feeding TNLean as a one-way Lake dependency.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
