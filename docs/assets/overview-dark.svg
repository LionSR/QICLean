  <text x="386" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.3" fill="#aeb6c8">Matrix families · Word spans</text>
  <text x="386" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.3" fill="#aeb6c8">Transfer maps · Quantum Wielandt</text>

