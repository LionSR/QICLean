  <text x="874" y="30" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" letter-spacing="0.04em" fill="#8b94a8">IMPORTS POINT DOWNWARD · ZERO TENSOR-NETWORK VOCABULARY</text>

