name: PR CI

# The pull-request pipeline: Lean build + style lint, blueprint lint and
# Lean-blueprint sync, and the Lean module-policy guards. Adapted from
# TNLean's pr-ci.yml: keeps the Lean build/lint/blueprint jobs and the
# module-policy guards. The existing blueprint job also renders and audits
# the pinned tenkz package; TNLean's package/corpus/RMP jobs stay upstream.
#
# One workflow means one completion event for the auto-fix dispatcher and
# per-job change gating: Lean-only changes skip the TeX pipeline, while
# blueprint changes also run the Lean build for compiled declaration checking.

on:
  push:
    branches:
      - main
    paths:
      - '**.lean'
      - 'lakefile.*'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'scripts/LintStyle.lean'
      - 'scripts/nolints-style.txt'
      - 'scripts/check_numbered_lean_files.py'
      - 'scripts/check_oversized_lean_files.py'
      - 'scripts/lean_import_syntax.py'
      - 'scripts/test_lean_file_policies.py'
      - 'scripts/lake_build_hotspots.py'
      - 'scripts/test_lake_build_hotspots.py'
      - 'scripts/seed_lake_build.sh'
      - 'scripts/test_seed_lake_build.sh'
      - 'scripts/ci_lean_checks.py'
      - 'scripts/test_ci_lean_checks.py'
      - 'scripts/generate_import_aggregators.py'
      - 'scripts/test_generate_import_aggregators.py'
      - 'docs/ci-automation.md'
      - 'docs/CONTRIBUTING.md'
      - '.github/workflows/pr-ci.yml'
      - '.github/workflows/blueprint.yml'
      - '.github/workflows/docgen.yml'
      - 'blueprint/src/**'
      - 'tenkz.toml'
      - 'scripts/fetch_tenkz.py'
      - 'scripts/tenkz_paths.py'
      - 'scripts/tenkz_blueprint_sweep.py'
      - 'scripts/test_tenkz_blueprint_sweep.py'
      - 'scripts/test_tenkz_pic.py'
      - 'blueprint/.chktexrc'
      - 'blueprint/latexindent.yaml'
      - 'scripts/blueprint_lean_sync.py'
      - 'scripts/test_blueprint_web_render.py'
      - 'scripts/check_reader_facing_prose.py'
      - 'docs/paper-gaps/**'
      - 'texra-blueprint.toml'
      # Trees the paper-gap reference check scans (texra-blueprint
      # paper-gaps check); without these the check never runs
      # on merge pushes that only touch a scanned file.
      - 'docs/**/*.md'
      - 'LICENSE'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/paper-gaps/**/*.tex'
      - 'docs/paper-gaps/**/*.bib'
      - 'texra-blueprint.toml'
      # Trees the paper-gap reference check scans (texra-blueprint
      # paper-gaps check); without these the check never runs
      # on PRs that only touch a scanned file.
      - 'docs/**/*.md'
      - '**.lean'
      - 'lakefile.*'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'scripts/LintStyle.lean'
      - 'scripts/nolints-style.txt'
      - 'scripts/check_numbered_lean_files.py'
      - 'scripts/check_oversized_lean_files.py'
      - 'scripts/lean_import_syntax.py'
      - 'scripts/test_lean_file_policies.py'
      - 'scripts/lake_build_hotspots.py'
      - 'scripts/test_lake_build_hotspots.py'
      - 'scripts/seed_lake_build.sh'
      - 'scripts/test_seed_lake_build.sh'
      - 'scripts/ci_lean_checks.py'
      - 'scripts/test_ci_lean_checks.py'
      - 'scripts/generate_import_aggregators.py'
      - 'scripts/test_generate_import_aggregators.py'
      - 'docs/ci-automation.md'
      - 'docs/CONTRIBUTING.md'
      - '.github/workflows/pr-ci.yml'
      - '.github/workflows/blueprint.yml'
      - '.github/workflows/docgen.yml'
      - 'blueprint/src/**'
      - 'tenkz.toml'
      - 'scripts/fetch_tenkz.py'
      - 'scripts/tenkz_paths.py'
      - 'scripts/tenkz_blueprint_sweep.py'
      - 'scripts/test_tenkz_blueprint_sweep.py'
      - 'scripts/test_tenkz_pic.py'
      - 'blueprint/.chktexrc'
      - 'blueprint/latexindent.yaml'
      - 'scripts/blueprint_lean_sync.py'
      - 'scripts/test_blueprint_web_render.py'
      - 'scripts/check_reader_facing_prose.py'
      - 'LICENSE'
  workflow_dispatch:

# A newer push to a pull request cancels the superseded run. A running main
# build is never cancelled, so it finishes and saves its build cache; only
# the newest pending main run is kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Build-cache policy: the cache is saved only from main and restored
# everywhere. Per-PR caches saved on every run evict a shared repository
# cache budget within minutes, so main's entry never survives — this is the
# same lesson TNLean's pr-ci.yml documents and this file inherits verbatim.
# Mathlib and its dependencies are intentionally excluded from the cache:
# `lake exe cache get` (run inside lean-action) restores them faster than a
# GitHub cache of that size could.
#
# QICLean-specific: TNLean depends on this repository's build output, so a
# release archive (`lake upload` on tagged commits) is the primary way
# TNLean avoids recompiling QICLean from source; see docs/UPGRADE_RUNBOOK.md.
env:
  BUILD_CACHE_PATHS: |
    .lake/build
    .lake/packages/Gametheory/.lake/build
    .lake/packages/checkdecls/.lake/build

jobs:
  # Per-job change gating. Push and dispatch runs skip this and run every job.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      lean: ${{ steps.filter.outputs.lean }}
      module_policy: ${{ steps.filter.outputs.module_policy }}
      blueprint: ${{ steps.filter.outputs.blueprint }}
      paper_gaps: ${{ steps.filter.outputs.paper_gaps }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            lean:
              - '**.lean'
              - '.github/workflows/pr-ci.yml'
              - 'lakefile.*'
              - 'lean-toolchain'
              - 'lake-manifest.json'
              - 'scripts/LintStyle.lean'
              - 'scripts/nolints-style.txt'
              - 'scripts/ci_lean_checks.py'
            module_policy:
              - 'scripts/check_numbered_lean_files.py'
              - 'scripts/check_oversized_lean_files.py'
              - 'scripts/lean_import_syntax.py'
              - 'scripts/test_lean_file_policies.py'
              - 'scripts/lake_build_hotspots.py'
              - 'scripts/test_lake_build_hotspots.py'
              - 'scripts/seed_lake_build.sh'
              - 'scripts/test_seed_lake_build.sh'
              - 'scripts/ci_lean_checks.py'
              - 'scripts/test_ci_lean_checks.py'
              - 'scripts/generate_import_aggregators.py'
              - 'scripts/test_generate_import_aggregators.py'
              - 'docs/ci-automation.md'
              - 'docs/CONTRIBUTING.md'
            blueprint:
              - '.github/workflows/pr-ci.yml'
              - 'blueprint/src/**'
              - '.github/workflows/blueprint.yml'
              - '.github/workflows/docgen.yml'
              - 'tenkz.toml'
              - 'scripts/fetch_tenkz.py'
              - 'scripts/tenkz_paths.py'
              - 'scripts/tenkz_blueprint_sweep.py'
              - 'scripts/test_tenkz_blueprint_sweep.py'
              - 'scripts/test_tenkz_pic.py'
              - 'blueprint/.chktexrc'
              - 'blueprint/latexindent.yaml'
              - 'scripts/check_reader_facing_prose.py'
              - 'scripts/test_blueprint_web_render.py'
            # Everything the paper-gap reference check reads: the notes,
            # the trees it scans for references, and its configuration.
            paper_gaps:
              - 'docs/paper-gaps/**'
              - '**.lean'
              - 'blueprint/src/**'
              - 'docs/**/*.md'
              - 'texra-blueprint.toml'

  build:
    needs: changes
    if: |
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.lean == 'true' ||
        needs.changes.outputs.blueprint == 'true'
      )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore Lean build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: qiclean-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            qiclean-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true
          use-github-cache: false

      - name: Require prebuilt Mathlib artifacts
        run: test -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      # Toolchain/Mathlib-revision lockstep guard: fails clean here instead
      # of a confusing kernel error downstream in TNLean. See
      # docs/UPGRADE_RUNBOOK.md §3. QICLean has no upstream dependency to
      # check against (it is the leaf), so this step is a no-op placeholder
      # documenting the invariant this repository must keep true for TNLean;
      # TNLean's own pr-ci.yml carries the real comparison step.

      # Build the changed production modules before the full library so a
      # failure surfaces early. The build is a shortcut: past its budget it
      # stops with a warning and the root build continues. Selection:
      # scripts/ci_lean_checks.py (mirrors TNLean#9119).
      - name: Build changed Lean modules early
        if: github.event_name == 'pull_request'
        timeout-minutes: 30
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eo pipefail
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA" || BASE_SHA=""
          fi
          python3 scripts/ci_lean_checks.py early --budget 1200 --log "$RUNNER_TEMP/lake-build.log"

      - name: Build Lean project and capture timings
        run: |
          set -eo pipefail
          {
            lake build
            lake build lint_style
          } 2>&1 | tee -a "$RUNNER_TEMP/lake-build.log"

      # Elaborate changed production files and every affected test file
      # (QICLeanTest/ and scripts/Tests/) with warnings as errors. A test is
      # affected when it changed or its import closure contains a changed
      # module; every test runs on manual dispatch and when a dependency pin,
      # the toolchain, this workflow or the selection script changes. New
      # modules and tests need no workflow edit. Selection:
      # scripts/ci_lean_checks.py.
      - name: Check changed Lean files and affected tests strictly
        timeout-minutes: 60
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eo pipefail
          case "$BASE_SHA" in 0000000000000000000000000000000000000000) BASE_SHA="" ;; esac
          if [ -n "$BASE_SHA" ] && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA" || BASE_SHA=""
          fi
          python3 scripts/ci_lean_checks.py strict --jobs 3

      - name: Check changed Lean compilation times
        id: compilation-time
        if: github.event_name == 'pull_request'
        env:
          BASE_REF_NAME: ${{ github.event.pull_request.base.ref }}
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          set -o pipefail
          # The default shell runs with -e: capture failures so this step
          # always succeeds and the enforcement step below reports them.
          timing_status=0
          git fetch --no-tags origin \
            "+refs/heads/$BASE_REF_NAME:refs/remotes/origin/$BASE_REF_NAME" \
            || timing_status=$?
          if [ "$timing_status" -eq 0 ]; then
            git -c core.quotePath=false diff \
              --merge-base --name-only --diff-filter=AMR "$BASE_REF" -- '*.lean' \
              > "$RUNNER_TEMP/changed-lean-files.txt" || timing_status=$?
          fi
          if [ "$timing_status" -eq 0 ]; then
            python3 scripts/lake_build_hotspots.py \
              "$RUNNER_TEMP/lake-build.log" \
              --changed-files-from "$RUNNER_TEMP/changed-lean-files.txt" \
              || timing_status=$?
          fi
          case "$timing_status" in
            0) echo "result=success" >> "$GITHUB_OUTPUT" ;;
            50) echo "result=limit" >> "$GITHUB_OUTPUT" ;;
            *) echo "result=error" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run text-based style linter
        run: lake exe lint_style --github

      # `checkdecls` imports QICLean modules to resolve every tagged
      # declaration, so it must run after the project build rather than in
      # a TeX-only job.
      - name: Generate Blueprint Lean declaration list
        run: python3 scripts/blueprint_lean_sync.py --root . --update-lean-decls

      - name: Check Blueprint Lean declarations
        timeout-minutes: 10
        run: lake exe checkdecls blueprint/lean_decls

      # Enforced last, so a timing failure still reports the lint and
      # declaration checks above. Formerly a separate job that spent a
      # runner on reading this step's output.
      - name: Enforce changed-module timing limit
        if: github.event_name == 'pull_request'
        env:
          TIMING_RESULT: ${{ steps.compilation-time.outputs.result }}
        run: |
          case "$TIMING_RESULT" in
            success) ;;
            limit)
              echo "::error::A changed Lean module reached the 50-second compilation limit"
              exit 1
              ;;
            *)
              echo "::error::The changed-module compilation-time checker failed"
              exit 1
              ;;
          esac

      - name: Save Lean build cache (main only)
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: qiclean-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}

  file-length:
    name: Check Lean module policies
    needs: changes
    if: |
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.lean == 'true' ||
        needs.changes.outputs.module_policy == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test Lean module-policy checkers
        run: PYTHONPATH=scripts python3 scripts/test_lean_file_policies.py -v

      - name: Test Lean compilation-time checker
        run: python3 scripts/test_lake_build_hotspots.py

      - name: Test changed-file Lean check selection
        run: python3 scripts/test_ci_lean_checks.py

      # Formerly the separate import-completeness.yml workflow, which spent
      # a runner on two Python commands.
      - name: Test import-aggregator generator
        run: PYTHONPATH=scripts python3 scripts/test_generate_import_aggregators.py -v

      - name: Check generated import aggregators
        run: PYTHONPATH=scripts python3 scripts/generate_import_aggregators.py --check

      # Ordinary Lean modules over 1000 lines fail. The exact root aggregator
      # exemption is accepted only while its uncommented content is import-only.
      - name: Run oversized-file guard
        run: >
          PYTHONPATH=scripts python3 scripts/check_oversized_lean_files.py
          --root .
          --import-only-aggregator QICLean.lean

      - name: Fetch pull-request base for the debt ratchet
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"

      - name: Reject new numbered-sequel modules (pull request)
        if: github.event_name == 'pull_request'
        run: >
          python3 scripts/check_numbered_lean_files.py
          --root .
          --base-ref "origin/${{ github.event.pull_request.base.ref }}"

      - name: Reject new numbered-sequel modules (push)
        if: github.event_name == 'push'
        run: >
          python3 scripts/check_numbered_lean_files.py
          --root .
          --base-ref "${{ github.event.before }}"

  blueprint:
    name: Check blueprint compiles without errors
    needs: changes
    if: "!cancelled() && (github.event_name != 'pull_request' || needs.changes.result == 'success')"
    runs-on: ubuntu-latest
    env:
      TEX_CHANGED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.blueprint == 'true' }}
      # The paper-gap reference check also runs when only the notes, the
      # Lean sources, the Markdown docs, or the configuration changed.
      PAPER_GAPS_CHANGED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.paper_gaps == 'true' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check reader-facing prose patterns
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          python3 scripts/check_reader_facing_prose.py --root . --diff-base "$BASE_REF" --ci

      - name: Detect changed Lean files
        id: changed-lean-files
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          changed_lean_paths="$(git diff --merge-base --name-only "$BASE_REF" -- \
            QICLean.lean 'QICLean/**/*.lean' lakefile.* lean-toolchain lake-manifest.json)"
          if [ -n "$changed_lean_paths" ]; then
            has_changed_lean=true
          else
            has_changed_lean=false
            while IFS= read -r tex_file; do
              if [ -f "$tex_file" ] && grep -Eq '\\lean\{|\\uses\{|\\leanok|\\notready' "$tex_file"; then
                has_changed_lean=true
                break
              fi
            done < <(git diff --merge-base --name-only "$BASE_REF" -- \
              'blueprint/src/**/*.tex' 'blueprint/src/*.tex')
          fi
          echo "has_changed_lean=$has_changed_lean" >> "$GITHUB_OUTPUT"

      - name: Install blueprint system dependencies
        if: env.TEX_CHANGED == 'true'
        uses: texra-ai/lean-env-action/blueprint-system-deps@v1

      # Also installed for paper-gap-only changes: the reference check
      # below runs the texra-blueprint CLI from this step's pip install.
      - name: Install blueprint Python dependencies
        if: env.TEX_CHANGED == 'true' || env.PAPER_GAPS_CHANGED == 'true'
        uses: texra-ai/lean-env-action/leanblueprint@v1
        with:
          extra-pip-packages: 'git+https://github.com/LionSR/texra-blueprint@v0.3.8'

      - name: Fetch pinned tenkz package
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/fetch_tenkz.py

      - name: Check paper-gap references resolve
        if: env.TEX_CHANGED == 'true' || env.PAPER_GAPS_CHANGED == 'true'
        run: texra-blueprint paper-gaps check

      - name: Lint LaTeX (chktex)
        if: env.TEX_CHANGED == 'true'
        working-directory: blueprint/src
        run: |
          find . -name '*.tex' -not -path '*/Packages/*' -print0 \
            | xargs -0 -r chktex -q -l ../.chktexrc

      - name: Check LaTeX formatting (latexindent)
        if: env.TEX_CHANGED == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -e
          status=0
          while IFS= read -r f; do
            if ! latexindent -k -s -l blueprint/latexindent.yaml "$f" > /dev/null; then
              echo "::warning file=$f::not formatted to blueprint/latexindent.yaml; run 'latexindent -l blueprint/latexindent.yaml -w -s \"$f\"' locally to fix"
              status=1
            fi
          done < <(find blueprint/src -name '*.tex' -not -path '*/Packages/*')
          exit $status

      - name: Build blueprint bibliography
        if: env.TEX_CHANGED == 'true'
        run: texra-blueprint bbl

      - name: Check tenkz picture pipeline
        if: env.TEX_CHANGED == 'true'
        run: |
          python3 scripts/test_tenkz_pic.py
          python3 scripts/test_tenkz_blueprint_sweep.py

      - name: Build blueprint PDF
        if: env.TEX_CHANGED == 'true'
        run: leanblueprint pdf

      - name: Run texra-blueprint web and check for errors
        if: env.TEX_CHANGED == 'true'
        working-directory: blueprint
        run: |
          set -o pipefail
          tmp_output_file="$(mktemp)"
          # texra-blueprint web wraps leanblueprint web and fails when the
          # renderer meets a command it does not know; the log is kept for
          # the label checks below.
          texra-blueprint web 2>&1 | tee "$tmp_output_file"
          if grep -q "^ERROR:" "$tmp_output_file"; then
            echo "::error::Blueprint has unresolved labels (see ERROR lines above)"
            exit 1
          fi
          if grep -q "WARNING: File not found:" "$tmp_output_file"; then
            echo "::warning::Blueprint has missing file references (see WARNING lines above)"
          fi
          if grep -R "tenkz SVG unavailable" web --include='*.html'; then
            echo "::error::Blueprint contains unrendered tenkz SVG placeholders"
            exit 1
          fi

      - name: Sweep tenkz blueprint event streams
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/tenkz_blueprint_sweep.py --allow-empty

      # A zero exit status says the build ran, not that the pages read. This
      # opens every generated page (via playwright/chromium) and measures
      # what a reader would meet.
      - name: Test generated blueprint pages
        if: env.TEX_CHANGED == 'true'
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/test_blueprint_web_render.py --web-root blueprint/web

      - name: Generate lean_decls from blueprint .tex files
        id: lean-decls
        run: python3 scripts/blueprint_lean_sync.py --root . --update-lean-decls

      - name: Check blueprint and Lean source stay in sync
        if: steps.lean-decls.outcome == 'success'
        run: python3 scripts/blueprint_lean_sync.py --root . --ci

      - name: Fetch PR base ref for diff
        id: fetch-base-ref
        if: github.event_name == 'pull_request' && steps.changed-lean-files.outputs.has_changed_lean == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "$BASE_REF"

      - name: Error on changed Lean declarations missing blueprint entries
        if: github.event_name == 'pull_request' && steps.changed-lean-files.outputs.has_changed_lean == 'true'
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          base_ref = os.environ["BASE_REF"]
          changed = subprocess.check_output(
              ["git", "diff", "--merge-base", "--name-only", "--diff-filter=AMR",
               base_ref, "--", "QICLean.lean", "QICLean/**/*.lean"],
              text=True,
          )
          changed_lean_files = [line for line in changed.splitlines() if line.endswith(".lean")]
          if not changed_lean_files:
              print("No changed QICLean/*.lean files in this pull request.")
              raise SystemExit(0)
          subprocess.run(
              ["python3", "scripts/blueprint_lean_sync.py", "--root", ".",
               "--warn-missing-blueprint", "--diff-base", base_ref,
               "--changed-files", *changed_lean_files],
              check=True,
          )
          PY
