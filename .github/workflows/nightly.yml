name: Nightly CI

# The integration pipeline. Pull requests run only the light checks of
# pr-ci.yml (changed modules, lint, source-level policies), so the whole
# library is built and the blueprint is rendered and tested here, once a
# night on main: the root `lake build`, the test files, the compiled
# declaration check, the print volume and web pages, and the publication of
# the site. A failed run on main starts nightly-fix.yml, whose agent opens a
# repair pull request and dispatches this workflow on its branch to verify
# it. Adapted from TNLean's nightly.yml.

on:
  schedule:
    # 18:53 UTC: half an hour before TNLean's nightly run, and off the hour
    # to avoid the scheduler's busiest minutes.
    - cron: '53 18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Run even when this commit already passed a nightly run
        type: boolean
        default: false

# A running main build is never cancelled, so it finishes and saves its build
# cache; a newer verification run of a repair branch replaces an older one.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Build-cache policy: this workflow's build of main is the only writer of the
# Lean build cache; pull requests restore it read-only (pr-ci.yml). Per-run
# caches would evict it from the shared repository cache budget. Mathlib and
# its dependencies are intentionally excluded: `lake exe cache get` (run
# inside lean-action) restores them faster than a GitHub cache of that size
# could.
#
# QICLean-specific: TNLean depends on this repository's build output, so a
# release archive (`lake upload` on tagged commits) is the primary way
# TNLean avoids recompiling QICLean from source; see docs/UPGRADE_RUNBOOK.md.
env:
  BUILD_CACHE_PATHS: |
    .lake/build
    .lake/packages/Gametheory/.lake/build
    .lake/packages/checkdecls/.lake/build

jobs:
  # Find the last commit of main that passed this workflow. A scheduled run
  # on that same commit has nothing new to check and is skipped; otherwise
  # the commit is the base for the changed-file checks and the ratchets.
  plan:
    name: Plan the nightly run
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - name: Find the last passing nightly commit
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          base="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')"
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || base=""
          run=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$FORCE" != true ] && [ "$base" = "$GITHUB_SHA" ]; then
            run=false
            echo "::notice::$GITHUB_SHA already passed a nightly run; nothing to do."
          fi
          {
            echo "run=$run"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      BASE_SHA: ${{ needs.plan.outputs.base }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore Lean build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: qiclean-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            qiclean-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true
          use-github-cache: false

      - name: Require prebuilt Mathlib artifacts
        run: test -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean

      # Keep the small RC-migration regressions independently observable before
      # the full build reaches unrelated dependencies. This is additive: the
      # root build and complete strict suite below remain mandatory.
      - name: Check focused Mathlib migration regressions strictly
        timeout-minutes: 30
        run: |
          set -eo pipefail
          lake --fail-fast build \
            QICLean.Algebra.Unitary.MatrixUnitaryBetween \
            QICLean.Analysis.Optimization.ConicProgram \
            QICLean.Analysis.CyclicInequality.Recursion \
            QICLean.Analysis.Optimization.HermitianMatrixCone \
            QICLean.Analysis.Order.LowEnergyPerturbation \
            QICLean.Spectral.Radius.PowerDecay \
            QICLean.Channel.Dilation.OrderedCP \
            QICLean.Channel.Peripheral.Asymptotic.RecurrentInverse \
            QICLean.Channel.Semigroup.Basic \
            QICLean.Channel.Semigroup.LindbladForm.TraceBridge \
            QICLean.Channel.Wigner.Rigidity \
            QICLean.Entropy.Conditional.DoubleCurve \
            QICLean.Probability.Gaussian.GaussianContraction \
            QICLean.Probability.Gaussian.ProductSource \
            QICLean.Probability.Gaussian.ProductSourceTransport \
            QICLean.Probability.Gaussian.SchmidtSource \
            QICLean.ManyBody.Replica.Symbol.CoherentMeasure
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from ci_lean_checks import run_batch
          paths = [
              "QICLean/Algebra/Unitary/MatrixUnitaryBetween.lean",
              "QICLean/Analysis/Optimization/ConicProgram.lean",
              "QICLean/Analysis/CyclicInequality/Recursion.lean",
              "QICLean/Analysis/Optimization/HermitianMatrixCone.lean",
              "QICLean/Analysis/Order/LowEnergyPerturbation.lean",
              "QICLean/Spectral/Radius/PowerDecay.lean",
              "QICLean/Channel/Dilation/OrderedCP.lean",
              "QICLean/Channel/Peripheral/Asymptotic/RecurrentInverse.lean",
              "QICLean/Channel/Semigroup/Basic.lean",
              "QICLean/Channel/Semigroup/LindbladForm/TraceBridge.lean",
              "QICLean/Channel/Wigner/Rigidity.lean",
              "QICLean/Entropy/Conditional/DoubleCurve.lean",
              "QICLean/Probability/Gaussian/GaussianContraction.lean",
              "QICLean/Probability/Gaussian/ProductSource.lean",
              "QICLean/Probability/Gaussian/ProductSourceTransport.lean",
              "QICLean/Probability/Gaussian/SchmidtSource.lean",
              "QICLean/ManyBody/Replica/Symbol/CoherentMeasure.lean",
              "QICLeanTest/Entropy/Conditional/DoubleCurveInstances.lean",
              "QICLeanTest/Probability/Gaussian/GaussianContraction.lean",
              "QICLeanTest/GaussianProductSourceTransport.lean",
              "QICLeanTest/Mathlib436Replacement.lean",
              "QICLeanTest/Probability/Gaussian/SchmidtSource.lean",
              "QICLeanTest/SemigroupNormable.lean",
          ]
          failed = run_batch(paths, None, jobs=3, timeout=240)
          if failed:
              print("Focused migration checks failed:", *failed, sep="\n  ")
              sys.exit(1)
          print("All focused migration checks passed.")
          PY

      - name: Build Lean project and capture timings
        id: lean-build
        run: |
          set -eo pipefail
          {
            lake build
            lake build lint_style
          } 2>&1 | tee -a "$RUNNER_TEMP/lake-build.log"

      # Saved as soon as the library is built, so a failure of a later check
      # does not cost the next pull requests their cache. A cancelled or
      # failed build can leave partially written `.olean` files and saves
      # nothing.
      - name: Save Lean build cache (main only)
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: qiclean-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}

      # Elaborate, with warnings as errors, every production file changed
      # since the last passing nightly commit, and every test file
      # (QICLeanTest/ and scripts/Tests/) that changed or whose import closure
      # contains a changed module; every test runs when no such commit is
      # known or when a dependency pin, the toolchain, this workflow or the
      # selection script changed. Selection: scripts/ci_lean_checks.py.
      - name: Check changed Lean files and affected tests strictly
        timeout-minutes: 120
        run: |
          set -eo pipefail
          if [ -n "$BASE_SHA" ] && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA" || BASE_SHA=""
          fi
          python3 scripts/ci_lean_checks.py strict --jobs 3

      - name: Run text-based style linter
        if: ${{ !cancelled() && steps.lean-build.outcome == 'success' }}
        run: lake exe lint_style --github

      # `checkdecls` imports QICLean modules to resolve every tagged declaration,
      # so it runs after the project build.
      - name: Generate Blueprint Lean declaration list
        if: ${{ !cancelled() && steps.lean-build.outcome == 'success' }}
        run: python3 scripts/blueprint_lean_sync.py --root . --update-lean-decls

      - name: Check Blueprint Lean declarations
        if: ${{ !cancelled() && steps.lean-build.outcome == 'success' }}
        timeout-minutes: 10
        run: lake exe checkdecls blueprint/lean_decls

      # The slowest modules of the whole library, for the job summary.
      - name: Report compilation-time hotspots
        if: ${{ !cancelled() && steps.lean-build.outcome == 'success' }}
        run: |
          {
            echo '### Slowest modules'
            echo '```'
            python3 scripts/lake_build_hotspots.py "$RUNNER_TEMP/lake-build.log" --limit 20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The whole-repository policies. Each pull request passes them against its
  # own base; two pull requests merged side by side can still break one
  # together, so the merged tree is checked again.
  policies:
    name: Check Lean module policies
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ needs.plan.outputs.base }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check generated import aggregators
        run: PYTHONPATH=scripts python3 scripts/generate_import_aggregators.py --check

      - name: Run oversized-file guard
        if: ${{ !cancelled() }}
        run: >
          PYTHONPATH=scripts python3 scripts/check_oversized_lean_files.py
          --root .
          --import-only-aggregator QICLean.lean

      # The recorded debts may only shrink against the last passing nightly
      # commit; without one the checks run without a historical comparison.
      - name: Enforce architecture ratchets
        if: ${{ !cancelled() }}
        run: |
          args=()
          numbered=()
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            args=(--base-revision "$BASE_SHA")
            numbered=(--base-ref "$BASE_SHA")
          fi
          python3 scripts/check_import_layers.py "${args[@]}"
          python3 scripts/check_pass_through_declarations.py "${args[@]}"
          python3 scripts/check_numbered_lean_files.py --root . "${numbered[@]}"

  # The blueprint half of the pipeline: the picture pipeline, the paper-gap
  # notes, the print volume, the web pages and their reader-facing tests,
  # and, on main, the publication of the site.
  site:
    name: Build and publish blueprint
    needs: plan
    if: needs.plan.outputs.run == 'true'
    uses: ./.github/workflows/blueprint.yml
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
