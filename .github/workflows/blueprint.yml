name: Blueprint

# Adapted from TNLean's blueprint.yml: omits the TNLean-specific split PDF.
# Pinned tenkz rendering and event audits run within the existing job. Otherwise
# unchanged: same leanblueprint build, same error/warning gating, same
# paper-gap reference check, same generated-page reader-facing check, same
# Pages deploy handoff. Beyond TNLean's version, this push path also builds
# and packages the paper-gap note PDFs: the blueprint bibliography links to
# them, so a deploy that published the links without the PDFs would leave
# them dangling until the next scheduled docgen run.

# It no longer runs on every push to main: nightly.yml calls it once a night,
# as the blueprint half of the integration pipeline (pull requests check the
# blueprint sources only), and it can be dispatched by hand for an immediate
# publication.

on:
  workflow_call:
  workflow_dispatch:

# A run on another branch (a manual dispatch, or the nightly verification of a
# repair branch) builds in its own group and never deploys.
concurrency:
  group: blueprint-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  blueprint:
    # Pinned to 24.04: Playwright 1.55 has no Chromium for 26.04, and dvisvgm there drops TikZ
    # ink. Return to ubuntu-latest once Playwright and the TeX toolchain support 26.04.
    runs-on: ubuntu-24.04
    name: Build blueprint site components
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Install system dependencies
        uses: texra-ai/lean-env-action/blueprint-system-deps@v1
        with:
          # texlive-fonts-extra supplies dsfont, which some paper-gap notes
          # load; the suffix separates the cache from the extra-package-free
          # web-v1 set.
          cache-suffix: web-v2
          extra-packages: texlive-fonts-extra

      - name: Install leanblueprint
        uses: texra-ai/lean-env-action/leanblueprint@v1
        with:
          extra-pip-packages: 'git+https://github.com/LionSR/texra-blueprint@v0.3.8'

      - name: Fetch pinned tenkz package
        run: python3 scripts/fetch_tenkz.py

      - name: Check tenkz picture pipeline
        run: |
          python3 scripts/test_tenkz_pic.py
          python3 scripts/test_tenkz_blueprint_sweep.py

      # Advisory (continue-on-error), as it was in the pull-request job.
      - name: Check LaTeX formatting (latexindent)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -e
          status=0
          while IFS= read -r f; do
            if ! latexindent -k -s -l blueprint/latexindent.yaml "$f" > /dev/null; then
              echo "::warning file=$f::not formatted to blueprint/latexindent.yaml; run 'latexindent -l blueprint/latexindent.yaml -w -s \"$f\"' locally to fix"
              status=1
            fi
          done < <(find blueprint/src -name '*.tex' -not -path '*/Packages/*')
          exit $status

      - name: Check paper-gap references resolve
        run: texra-blueprint paper-gaps check

      - name: Build blueprint bibliography
        run: texra-blueprint bbl

      # The bibliography links every paper-gap note to its published PDF, so
      # the same deploy that publishes the links must also publish the PDFs;
      # the weekly docgen run alone would leave links to freshly added notes
      # dangling until it next succeeds.
      - name: Build paper-gap PDFs
        run: texra-blueprint --root . paper-gaps build

      - name: Build blueprint
        run: |
          set -o pipefail
          tmp_output_file="$(mktemp)"

          leanblueprint pdf

          # `leanblueprint pdf` finishes by copying print/print.bbl over
          # src/web.bbl. The print build's bibtex run uses the `plain` style,
          # whose `\bibitem{key}` carries no natbib optional label, and
          # plasTeX then renders every citation as "??". Regenerate the
          # natbib-style web bibliography that web.tex needs.
          texra-blueprint bbl

          # texra-blueprint web wraps leanblueprint web and fails when the
          # renderer meets a command it does not know; the log is kept for
          # the label checks below.
          texra-blueprint web 2>&1 | tee "$tmp_output_file"

          # Pull requests no longer build the web pages, so this is where an
          # unresolved label fails.
          if grep -q "^ERROR:" "$tmp_output_file"; then
            echo "::error::Blueprint has unresolved labels (see ERROR lines above)"
            exit 1
          fi
          if grep -q "WARNING: File not found:" "$tmp_output_file"; then
            echo "::error::Blueprint has missing files (see WARNING lines above)"
            exit 1
          fi
          if grep -R "tenkz SVG unavailable" blueprint/web --include='*.html'; then
            echo "::error::Blueprint contains unrendered tenkz SVG placeholders"
            exit 1
          fi

      - name: Sweep tenkz blueprint event streams
        run: python3 scripts/tenkz_blueprint_sweep.py --allow-empty

      # A zero exit status says the build ran, not that the pages read. The
      # site is published from here, so the reader-facing check runs here too
      # and not only where a pull request is reviewed.
      - name: Test generated blueprint pages
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/test_blueprint_web_render.py --web-root blueprint/web

      - name: Package site components
        run: |
          mkdir -p site-blueprint site-badges
          cp -r blueprint/web site-blueprint/blueprint
          cp blueprint/print/print.pdf site-blueprint/blueprint.pdf
          texra-blueprint --root . paper-gaps site site-blueprint/paper-gaps
          python3 scripts/write_badges.py site-badges

      - name: Build homepage
        uses: actions/jekyll-build-pages@v1
        with:
          source: home_page
          destination: site-blueprint/homepage

      # deploy-pages.yml fetches the newest artifact of each name, so only
      # main may publish site components.
      - name: Upload blueprint component
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-blueprint
          path: site-blueprint
          retention-days: 30

      - name: Upload badges component
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-badges
          path: site-badges
          retention-days: 30

  deploy:
    name: Deploy Pages site
    needs: blueprint
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
