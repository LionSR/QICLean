# Configuration for the shared texra-blueprint tooling.
# https://github.com/LionSR/texra-blueprint

# Per-chapter dependency graphs with the chapter-chooser page, plus
# cross-chapter boundary edges, matching the TNLean blueprint site.
[blueprint.graphs]
by_chapter = true
boundary   = true

[paper_gaps]
dir         = "docs/paper-gaps"
site_base   = "https://sirui-lu.com/QICLean"
blob_base   = "https://github.com/LionSR/QICLean/blob/main/docs/paper-gaps"
bib_author  = "The {QICLean} contributors"
institution = "QICLean"
title       = "QICLean paper-gap notes"
scan_roots  = ["QICLean", "blueprint/src", "docs"]
skip        = ["command.tex", "template.tex"]
# Every note must carry a \gapnote{kind}{status} verdict marker.
require_verdict = true

# The source-key registry: every note is named <key>_<topic>.tex. Author
# initials plus two-digit year, or a canonical short name for a book or
# review; qiclean marks internal theorem-surface audits with no single
# external source. Enforced by `texra-blueprint paper-gaps check`.
[paper_gaps.sources]
spwc10 = "Sanz, Pérez-García, Wolf and Cirac, A quantum version of Wielandt’s inequality, arXiv:0909.5347"
hastings05 = "Hastings, Solving gapped Hamiltonians locally, Phys. Rev. B 73 (2006) 085115, arXiv:cond-mat/0508554"
hastings07 = "Hastings, An area law for one-dimensional quantum systems, J. Stat. Mech. (2007) P08024, arXiv:0705.2024"
qiclean = "internal theorem-surface audit, no single external source"
wolf    = "Wolf, Quantum Channels & Operations (2012 lecture notes)"
ha98    = "Ha, Atomic Positive Linear Maps in Matrix Algebras (1998)"
yamagami93 = "Yamagami, Cyclic Inequalities (1993)"
cpgsv17 = "arXiv:1606.00608 (MPDO renormalization fixed points)"
cpsv16  = "arXiv:1606.00608 (matrix product density operators)"
mpu     = "arXiv:1703.09188 (matrix product unitaries)"
sw04    = "arXiv:quant-ph/0405174 (reversible quantum cellular automata)"
oai26   = "OpenAI mathematical-physics preprints of September 24, 2026 (two-dimensional area law; polynomial PEPS approximation)"
aklv13 = "Arad, Kitaev, Landau and Vazirani, arXiv:1301.1162v1 (2013)"
alvv16 = "Arad, Landau, Vazirani and Vidick, arXiv:1602.08828v2 (2016)"
akl14 = "Arad, Kuwahara and Landau, Connecting global and local energy distributions in quantum spin models on a lattice, arXiv:1406.3898v3 (2014)"
lvv13   = "arXiv:1307.5143 (Landau, Vazirani and Vidick, one-dimensional gapped ground states)"
gn96    = "Griffiths and Niu, Semiclassical Fourier transform for quantum computation, Phys. Rev. Lett. 76 (1996) 3228, arXiv:quant-ph/9511007"
psc21   = "Piroli, Styliaris and Cirac, arXiv:2103.13367 (quantum circuits assisted by LOCC, phases of matter)"
mswc24  = "Malz, Styliaris, Wei and Cirac, Preparation of matrix product states with log-depth quantum circuits, Phys. Rev. Lett. 132 (2024) 040404, arXiv:2307.01696"
tropp12 = "Tropp, User-friendly tail bounds for sums of random matrices, Found. Comput. Math. 12 (2012), arXiv:1004.4389"
nachtergaele96 = "Nachtergaele, The spectral gap for some spin chains with discrete symmetry breaking, Commun. Math. Phys. 175 (1996) 565, arXiv:cond-mat/9410110"
fbc25   = "Franco-Rubio, Garre-Rubio and Cirac, arXiv:2502.20257 (2025)"
glm23   = "Garre-Rubio, Lootens and Molnar, arXiv:2203.12563 (2023)"
gnvw12  = "Gross, Nesme, Vogts and Werner, Commun. Math. Phys. 310 (2012)"
polypeps = "Polynomial PEPS approximation of gapped square-grid ground states, September 24, 2026 manuscript"
scp10   = "Schuch, Cirac and Perez-Garcia, arXiv:1001.3807 (2010)"
